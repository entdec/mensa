# Per-repository settings for bin/de, which comes from the de repository and
# is the same everywhere.

# Prefix of every environment name, and the folder the checkout appears at
# inside the container (/workspaces/<ENV_REPO>, see devcontainer.json).
ENV_REPO=mensa

# Branches whose environments are persistent: they keep their volumes and are
# never removed by bin/de prune. Every other branch gets an ephemeral one.
PERSISTENT_BRANCHES=(staging develop)

# Branches whose environment is named just ENV_REPO, e.g. reachable as
# app.mensa.orb.local. Always persistent.
PRIMARY_BRANCHES=(main master)

# Selenium the system tests drive: the environment's own container. To watch
# a test in a browser on the Mac instead, override it for one command:
#
#   SELENIUM_URL=http://host.docker.internal:4444/ HEADLESS=0 bin/de exec bin/rails test:system
SELENIUM_URL="http://selenium:4444/"

# Run in the container at the end of bin/de up, from the checkout root, e.g.
# to prepare the test database (postStart.sh prepares the development one).
# From the engine root, so the engine's own migrations are included.
UP_COMMAND=(env RAILS_ENV=test bin/rails app:db:prepare)

# Version of @devcontainers/cli to run through npx when `devcontainer` isn't
# installed.
DEVCONTAINER_CLI_VERSION=0.90.0
